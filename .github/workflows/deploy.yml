name: Build and deploy to GitHub Pages

# Pages is served from the gh-pages branch. Every run fetches the gas index
# snapshot (public/prices.json), tests, builds and pushes dist/ to that branch.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * 1-5"   # 16:30 ET on weekdays, after the daily hub prices post
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Fetch gas indexes
        env:
          OILPRICEAPI_KEY: ${{ secrets.OILPRICEAPI_KEY }}
        run: node scripts/fetch-prices.mjs

      - run: npm test

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "Deploy ${{ github.sha }} (${{ github.event_name }})"
